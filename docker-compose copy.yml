version: "3"
services:
  frontend:
    # 前端项目路径
    build: ./packages/client
    # 镜像名
    image: frontend-image
    # 容器名
    container_name: frontend-container
    #   entrypoint:
    #      - sleep
    #      - '3600'
    ports:
      - 8081:80
    # 自定义网络 方便容器之间 通过[容器名]通信, [ip]会变的，不方便
    networks:
      - mysql_bridge
    # 依赖于后台服务 因为我们在前面定义的nginx中请求后台了
    depends_on:
      - server
    # 将项目的nginx卷映射到容器中
    volumes:
      - ./packages/client/nginx.conf:/etc/nginx/conf.d/default.conf

  server:
    build: ./packages/server
    image: server-image
    container_name: server-container
    ports:
      - 8080:3000
    networks:
      - mysql_bridge
    depends_on:
      - db

  db:
    restart: always
    image: daocloud.io/library/mysql:8.0.20
    container_name: mysql-db # 容器名
    ports:
      - 3307:3306
    networks:
      - mysql_bridge
    environment:
      - MYSQL_ROOT_PASSWORD=syq123456
    volumes:
      #- /home/mysql/conf/my.cnf:/etc/mysql/my.cnf
      #- /home/mysql/initdb/:/docker-entrypoint-initdb.d/
      - /home/mysql/data/:/var/lib/mysql/

# 声明一下网桥  my-server。
# 重要：将所有服务都挂载在同一网桥即可通过容器名来互相通信了
# 如egg连接mysql和redis，可以通过容器名来互相通信
networks:
  mysql_bridge:
    driver: custom-driver-2
