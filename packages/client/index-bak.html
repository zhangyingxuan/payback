<!DOCTYPE html>
<html lang="zh-cn">
  <head>
    <meta charset="utf-8" />
    <meta name="theme-color" content="#60a5fa" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0"
    />
    
    <!-- 基础SEO优化 -->
    <title>payBack - 智能支付返现平台</title>
    <meta name="description" content="payBack是一个智能支付返现平台，为用户提供便捷的支付服务和丰厚的返现奖励。安全、高效、可靠的支付解决方案。" />
    <meta name="keywords" content="支付返现,智能支付,返现平台,支付服务,金融科技" />
    <meta name="author" content="payBack团队" />
    <meta name="robots" content="index, follow" />
    
    <!-- Open Graph Meta Tags (社交媒体优化) -->
    <meta property="og:title" content="payBack - 智能支付返现平台" />
    <meta property="og:description" content="payBack是一个智能支付返现平台，为用户提供便捷的支付服务和丰厚的返现奖励。" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="payBack" />
    
    <!-- Twitter Card Meta Tags -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="payBack - 智能支付返现平台" />
    <meta name="twitter:description" content="payBack是一个智能支付返现平台，为用户提供便捷的支付服务和丰厚的返现奖励。" />
    
    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    
    <!-- Canonical URL -->
    <link rel="canonical" href="https://payback.example.com" />
    
    <!-- 结构化数据标记 (Schema.org) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "payBack",
      "description": "智能支付返现平台",
      "url": "https://payback.example.com"
    }
    </script>
    <!-- 预加载关键资源 -->
    <link rel="preconnect" href="https://at.alicdn.com" />
    <link rel="dns-prefetch" href="https://at.alicdn.com" />
    
    <!-- 字体预加载 -->
    <link
      rel="stylesheet"
      href="https://at.alicdn.com/t/font_830376_qzecyukz0s.css"
    />
    
    <!-- 性能优化 -->
    <meta name="format-detection" content="telephone=no" />
    <meta name="format-detection" content="date=no" />
    <meta name="format-detection" content="address=no" />
    <meta name="format-detection" content="email=no" />
    
    <!-- 移动端优化 -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="payBack" />
    
    <!-- 安全相关 -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://at.alicdn.com; font-src 'self' https://at.alicdn.com;" />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta http-equiv="X-Frame-Options" content="DENY" />
    <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin" />
    <script>
      document.addEventListener(
        'touchstart',
        function (event) {
          // event.preventDefault();
        },
        { passive: false },
      );

      document.addEventListener(
        'wheel',
        function (event) {
          // event.preventDefault();
        },
        { passive: false },
      );
    </script>
  </head>

  <body>
    <noscript>
      <strong
        >We're sorry but <%= htmlWebpackPlugin.options.title %> doesn't work
        properly without JavaScript enabled. Please enable it to
        continue.</strong
      >
    </noscript>
    <div id="app">
      <style>
        html,
        body,
        #app {
          width: 100%;
          height: 100%;
          display: flex;
          position: relative;
          justify-content: center;
          align-items: center;
          overflow: hidden;
        }

        .loader,
        .loader:before,
        .loader:after {
          border-radius: 50%;
          width: 2.5em;
          height: 2.5em;
          animation-fill-mode: both;
          animation: loadAnimation 1.8s infinite ease-in-out;
        }

        .loader {
          color: #406eeb;
          font-size: 10px;
          margin: 80px auto;
          position: relative;
          text-indent: -9999em;
          transform: translateZ(0);
          animation-delay: -0.16s;
          top: 0;
          transform: translate(-50%, 0);
        }

        .loader:before,
        .loader:after {
          content: '';
          position: absolute;
          top: 0;
        }

        .loader:before {
          left: -3.5em;
          animation-delay: -0.32s;
        }

        .loader:after {
          left: 3.5em;
        }

        @keyframes loadAnimation {
          0%,
          80%,
          100% {
            box-shadow: 0 2.5em 0 -1.3em;
          }

          40% {
            box-shadow: 0 2.5em 0 0;
          }
        }
      </style>
      <div class="loader"></div>
    </div>

    <script type="module" src="/src/main.ts"></script>
    <!-- built files will be auto injected -->
  </body>
</html>
