<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>赛博木鱼 - 3D积攒功德</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <!-- 引入 Three.js -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body class="bg-stone-900 text-stone-100 overflow-hidden select-none font-serif">

    <!-- 背景图层 -->
    <div class="fixed inset-0 z-0">
        <img src="https://zhiyan-ai-agent-with-1258344702.cos.ap-guangzhou.tencentcos.cn/with/7befa93e-3a77-4253-bd10-b36824b3ec76/image_1765206775_2_1.jpg" 
             alt="Zen Background" 
             class="w-full h-full object-cover opacity-40 blur-sm">
        <div class="absolute inset-0 bg-gradient-to-b from-stone-900/50 via-transparent to-stone-900/80"></div>
    </div>

    <!-- 主界面 -->
    <div class="relative z-10 h-screen flex flex-col items-center justify-between py-8 pointer-events-none">
        
        <!-- 顶部：功德显示 -->
        <div class="text-center space-y-2 mt-4 pointer-events-auto">
            <h1 class="text-xl text-stone-400 tracking-widest font-light">当前功德</h1>
            <div class="text-6xl font-bold text-amber-400 drop-shadow-lg font-['Ma_Shan_Zheng']" id="merit-count">0</div>
            <div class="text-sm text-stone-500" id="mode-indicator">普通模式</div>
        </div>

        <!-- 中部：3D交互区 (Canvas) -->
        <!-- 注意：Canvas 需要 pointer-events-auto 才能接收点击 -->
        <div id="canvas-container" class="absolute inset-0 z-0 pointer-events-auto"></div>

        <!-- 飘字容器 (覆盖在Canvas之上) -->
        <div id="floating-text-container" class="absolute inset-0 pointer-events-none overflow-hidden z-20"></div>

        <!-- 底部：控制栏 -->
        <div class="w-full max-w-md px-6 mb-8 space-y-6 pointer-events-auto relative z-50">
            
            <!-- 模式选择 -->
            <div class="flex justify-center space-x-4 bg-stone-800/60 backdrop-blur-md p-2 rounded-full border border-stone-700/50">
                <button class="mode-btn active px-4 py-2 rounded-full text-sm transition-all duration-300 hover:bg-stone-700 text-stone-300" data-mode="normal">
                    普通
                </button>
                <button class="mode-btn px-4 py-2 rounded-full text-sm transition-all duration-300 hover:bg-stone-700 text-stone-300" data-mode="challenge">
                    挑战
                </button>
                <button class="mode-btn px-4 py-2 rounded-full text-sm transition-all duration-300 hover:bg-stone-700 text-stone-300" data-mode="meditation">
                    冥想
                </button>
            </div>

            <!-- 功能按钮 -->
            <div class="flex justify-between items-center">
                <button id="store-btn" class="flex items-center space-x-2 text-amber-400 hover:text-amber-300 transition-colors">
                    <img src="https://zhiyan-ai-agent-with-1258344702.cos.ap-guangzhou.tencentcos.cn/with/366ad1c3-de6d-44a1-9a3e-e39c709bedb7/image_1765206784_1_1.png" class="w-6 h-6" alt="Store">
                    <span>功德商店</span>
                </button>
                
                <div class="flex space-x-4">
                    <button id="settings-btn" class="text-stone-400 hover:text-stone-200 transition-colors" title="设置">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                        </svg>
                    </button>
                    <button id="sound-toggle" class="text-stone-400 hover:text-stone-200 transition-colors" title="静音/开启">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z" />
                        </svg>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- 设置弹窗 -->
    <div id="settings-modal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-sm hidden opacity-0 transition-opacity duration-300 pointer-events-auto">
        <div class="bg-stone-800 border border-stone-600 rounded-2xl p-6 w-full max-w-sm mx-4 shadow-2xl transform scale-95 transition-transform duration-300" id="settings-content">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-2xl font-['Ma_Shan_Zheng'] text-stone-200">修行设置</h2>
                <button id="close-settings" class="text-stone-400 hover:text-white">&times;</button>
            </div>
            
            <div class="space-y-6">
                <!-- 音效设置 -->
                <div class="space-y-2">
                    <label class="text-sm text-stone-400">敲击音效</label>
                    <div class="grid grid-cols-2 gap-2">
                        <button class="setting-option px-3 py-2 rounded-lg border border-stone-600 text-sm text-stone-300 hover:bg-stone-700 transition-colors active" data-type="sound" data-value="default">
                            清脆木鱼
                        </button>
                        <button class="setting-option px-3 py-2 rounded-lg border border-stone-600 text-sm text-stone-300 hover:bg-stone-700 transition-colors disabled:opacity-50 disabled:cursor-not-allowed" data-type="sound" data-value="deep" id="opt-sound-deep">
                            深山古刹 🔒
                        </button>
                    </div>
                </div>

                <!-- 特效设置 -->
                <div class="space-y-2">
                    <label class="text-sm text-stone-400">视觉特效</label>
                    <div class="grid grid-cols-2 gap-2">
                        <button class="setting-option px-3 py-2 rounded-lg border border-stone-600 text-sm text-stone-300 hover:bg-stone-700 transition-colors active" data-type="effect" data-value="star">
                            星光点点
                        </button>
                        <button class="setting-option px-3 py-2 rounded-lg border border-stone-600 text-sm text-stone-300 hover:bg-stone-700 transition-colors disabled:opacity-50 disabled:cursor-not-allowed" data-type="effect" data-value="gold" id="opt-effect-gold">
                            佛光普照 🔒
                        </button>
                    </div>
                </div>

                <!-- 恢复默认 -->
                <div class="pt-4 border-t border-stone-700">
                    <button id="reset-settings-btn" class="w-full py-2 text-sm text-stone-500 hover:text-stone-300 transition-colors">
                        恢复默认设置
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- 商店弹窗 -->
    <div id="store-modal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-sm hidden opacity-0 transition-opacity duration-300 pointer-events-auto">
        <div class="bg-stone-800 border border-stone-600 rounded-2xl p-6 w-full max-w-sm mx-4 shadow-2xl transform scale-95 transition-transform duration-300" id="store-content">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-2xl font-['Ma_Shan_Zheng'] text-amber-400">功德商店</h2>
                <button id="close-store" class="text-stone-400 hover:text-white">&times;</button>
            </div>
            
            <div class="space-y-4">
                <!-- 商品项 -->
                <div class="flex justify-between items-center p-3 bg-stone-700/50 rounded-lg border border-stone-600">
                    <div class="flex items-center space-x-3">
                        <div class="w-10 h-10 bg-amber-900/50 rounded-full flex items-center justify-center text-amber-500">🎵</div>
                        <div>
                            <div class="text-stone-200 font-bold">深山古刹音效</div>
                            <div class="text-xs text-stone-400">更深沉的木鱼声</div>
                        </div>
                    </div>
                    <button class="buy-btn px-3 py-1 bg-amber-600 hover:bg-amber-500 text-white text-xs rounded-full transition-colors" data-cost="100" data-item="sound_deep">
                        100 功德
                    </button>
                </div>

                <div class="flex justify-between items-center p-3 bg-stone-700/50 rounded-lg border border-stone-600">
                    <div class="flex items-center space-x-3">
                        <div class="w-10 h-10 bg-amber-900/50 rounded-full flex items-center justify-center text-amber-500">✨</div>
                        <div>
                            <div class="text-stone-200 font-bold">金光特效</div>
                            <div class="text-xs text-stone-400">点击时散发金光</div>
                        </div>
                    </div>
                    <button class="buy-btn px-3 py-1 bg-amber-600 hover:bg-amber-500 text-white text-xs rounded-full transition-colors" data-cost="500" data-item="effect_gold">
                        500 功德
                    </button>
                </div>
            </div>
            <div class="mt-6 text-center text-xs text-stone-500">
                更多禅意好物敬请期待...
            </div>
        </div>
    </div>

    <!-- 挑战结束弹窗 -->
    <div id="challenge-modal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-sm hidden pointer-events-auto">
        <div class="bg-stone-800 border border-amber-500/30 rounded-2xl p-8 text-center max-w-sm mx-4 shadow-2xl">
            <h2 class="text-3xl font-['Ma_Shan_Zheng'] text-amber-400 mb-2">挑战结束</h2>
            <p class="text-stone-300 mb-6">本次修行共积攒功德</p>
            <div class="text-5xl font-bold text-white mb-8" id="challenge-score">0</div>
            <button id="close-challenge" class="px-8 py-2 bg-amber-600 hover:bg-amber-500 text-white rounded-full transition-colors">
                善哉善哉
            </button>
        </div>
    </div>

    <!-- 倒计时显示 (仅挑战模式) -->
    <div id="timer-display" class="fixed top-24 left-1/2 transform -translate-x-1/2 bg-red-900/80 text-red-100 px-4 py-1 rounded-full text-sm hidden pointer-events-none">
        剩余时间: <span id="time-left">30</span>s
    </div>

    <footer class="fixed bottom-2 w-full text-center pointer-events-none">
        <p class="text-xs text-stone-600">由 <a href="https://with.woa.com/" style="color: #8A2BE2; pointer-events: auto;" target="_blank">with</a> 通过自然语言生成</p>
    </footer>

    <!-- 模块化引入 script.js -->
    <script type="module" src="script.js"></script>
</body>
</html>
